<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Symposium: A Media Literacy Interactive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');

  :root {
    --bg-color: #0f1115;
    --panel-bg: #1a1d24;
    --status-bg: #15171d;
    --border-color: #2d333b;
    --text-main: #e6edf3;
    --text-muted: #7d8590;
    --accent-color: #4493f8;
    --good-color: #3fb950;
    --neutral-color: #d29922;
    --bad-color: #f85149;
    --shadow-color: rgba(0,0,0,0.4);
    --btn-hover: rgba(255,255,255,0.05);
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'Roboto Mono', monospace;
  }

  html[data-theme="light"] {
    --bg-color: #eef0f3;
    --panel-bg: #ffffff;
    --status-bg: #f7f8fa;
    --border-color: #dde1e6;
    --text-main: #1c2128;
    --text-muted: #636c76;
    --accent-color: #1868db;
    --good-color: #1a7f37;
    --neutral-color: #9a6700;
    --bad-color: #cf222e;
    --shadow-color: rgba(20,25,35,0.12);
    --btn-hover: rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    font-family: var(--sans);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Phone Interface Simulation */
  .device-frame {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px var(--shadow-color);
    transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 14px 20px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--border-color);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    background: var(--btn-hover);
    color: var(--text-main);
  }

  .theme-toggle:focus-visible,
  .btn:focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: 2px;
  }

  .theme-toggle svg {
    width: 14px;
    height: 14px;
  }

  .scene-content {
    padding: 24px 20px;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .context-tag {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-color);
    margin-bottom: 12px;
  }

  .text-bubble {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-main);
    margin-bottom: 24px;
    animation: fadeIn 0.4s ease-out;
  }

  .text-bubble p {
    margin-bottom: 12px;
  }

  .text-bubble p:last-child {
    margin-bottom: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .choices-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    font-family: var(--sans);
    font-size: 14px;
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    line-height: 1.4;
  }

  .btn:hover {
    background: var(--btn-hover);
    border-color: var(--text-muted);
  }

  .btn.primary {
    background: var(--text-main);
    color: var(--bg-color);
    text-align: center;
    font-weight: 500;
    border-color: var(--text-main);
  }

  .btn.primary:hover {
    opacity: 0.85;
  }

  .ending-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .ending-badge.good { background: rgba(63,185,80,0.15); color: var(--good-color); }
  .ending-badge.neutral { background: rgba(210,153,34,0.15); color: var(--neutral-color); }
  .ending-badge.bad { background: rgba(248,81,73,0.15); color: var(--bad-color); }

  .instructions {
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .text-bubble { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="device-frame">
    <div class="status-bar">
      <span id="timestamp">07:00 AM</span>
      <div class="status-right">
        <span id="location">Home</span>
        <button id="themeToggle" class="theme-toggle" aria-label="Switch between light and dark mode" title="Switch theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </div>

    <div class="scene-content">
      <div class="context-tag" id="contextTag"></div>
      <div class="text-bubble" id="sceneText"></div>
      <div class="choices-container" id="choices"></div>
    </div>
  </div>
  <div class="instructions">INTERACTIVE SYMPOSIUM MODULE</div>
</div>

<script>
  /*
    Point System (Max 21 Points)
    3 pts: Optimal Media Literacy choice
    1 pt: Passive/Neutral choice
    0 pts: Poor/Harmful choice
  */

  const STORY = {
    // SCENARIO 1: Morning (Evaluating Information)
    start: {
      time: "07:30 AM", loc: "Group Chat", tag: "Notification Received",
      text: "<p>You wake up to 47 unread messages in your family group chat. An aunt forwarded a lengthy text claiming a new localized virus is spreading, followed by 'SHARE OR THE GOVERNMENT WILL HIDE THIS'.</p><p>Some relatives are already panicking.</p>",
      choices: [
        { label: "Check official health department channels to verify the claim.", next: "s1_verify", points: 3 },
        { label: "Mute the chat and get ready for your day.", next: "s1_ignore", points: 1 },
        { label: "Forward it to your friends' group chat just in case it's real.", next: "s1_share", points: 0 }
      ]
    },
    s1_verify: {
      time: "07:35 AM", loc: "Group Chat", tag: "Action Taken",
      text: "<p>A quick search confirms it's a recycled hoax from three years ago. You drop a link to a fact-checking site in the chat, calming things down before you head out.</p>",
      choices: [{ label: "Head to the event", next: "s2", points: 0, type: "primary" }]
    },
    s1_ignore: {
      time: "07:35 AM", loc: "Group Chat", tag: "Action Taken",
      text: "<p>You mute the chat and move on with your morning. You didn't spread the rumor yourself, but it keeps going around your family anyway.</p>",
      choices: [{ label: "Head to the event", next: "s2", points: 0, type: "primary" }]
    },
    s1_share: {
      time: "07:35 AM", loc: "Group Chat", tag: "Action Taken",
      text: "<p>You forward the message. Later you find out it was a recycled hoax, and you helped spread panic without checking if it was even true.</p>",
      choices: [{ label: "Head to the event", next: "s2", points: 0, type: "primary" }]
    },

    // SCENARIO 2: Commute (Media Effects / Algorithm)
    s2: {
      time: "08:15 AM", loc: "Transit", tag: "Scrolling Feed",
      text: "<p>On your way to the symposium, you scroll through social media. The app shows you an aggressive, emotionally charged video about a local political issue. It matches your own views, but some of the claims sound exaggerated.</p>",
      choices: [
        { label: "Leave an angry comment validating the video and share it.", next: "s2_react", points: 0 },
        { label: "Scroll past it. You don't have time for debates right now.", next: "s2_scroll", points: 1 },
        { label: "Look up the creator's profile to understand their agenda before engaging.", next: "s2_critical", points: 3 }
      ]
    },
    s2_react: {
      time: "08:20 AM", loc: "Transit", tag: "Action Taken",
      text: "<p>You react right away. The app picks up on your anger and starts showing you more content like it for the rest of the week.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },
    s2_scroll: {
      time: "08:20 AM", loc: "Transit", tag: "Action Taken",
      text: "<p>You keep scrolling. The app notices you didn't engage and adjusts a little, but your feed still leans the same way it did before.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },
    s2_critical: {
      time: "08:20 AM", loc: "Transit", tag: "Action Taken",
      text: "<p>You check the account and see it's known for posting one-sided, misleading content. You close the app instead of reacting.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },

    // SCENARIO 3: Registration (Digital Footprint / Security)
    s3: {
      time: "09:00 AM", loc: "Symposium Desk", tag: "Event Registration",
      text: "<p>At the venue, a kiosk asks you to log in with your main social media account to get a 'smart networking badge.' The privacy policy is 40 pages long, and no one is actually reading it.</p>",
      choices: [
        { label: "Log in with your main account. It's an official event, so it's probably fine.", next: "s3_give", points: 0 },
        { label: "Decline the smart badge and ask the staff for a standard printed ID.", next: "s3_protect", points: 3 },
        { label: "Use a secondary 'burner' account you barely use to get the badge.", next: "s3_burner", points: 1 }
      ]
    },
    s3_give: {
      time: "09:05 AM", loc: "Symposium Desk", tag: "Action Taken",
      text: "<p>You log in. By the afternoon, random promotional emails start showing up in your inbox. You traded your personal data for a bit of convenience.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },
    s3_protect: {
      time: "09:05 AM", loc: "Symposium Desk", tag: "Action Taken",
      text: "<p>The staff prints you a regular badge instead. You miss out on the automated networking app, but your personal data stays safe.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },
    s3_burner: {
      time: "09:05 AM", loc: "Symposium Desk", tag: "Action Taken",
      text: "<p>You get the badge without using your real account. It's a practical workaround, even if it skips the point of the networking feature.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },

    // SCENARIO 4: The Keynote (IP / Copyright)
    s4: {
      time: "10:30 AM", loc: "Main Hall", tag: "Urgent Message",
      text: "<p>During a session on intellectual property, your phone buzzes. A colleague needs an image for a presentation starting in ten minutes. They send a watermarked photo they found on Google Images and ask if they should just crop the watermark out.</p>",
      choices: [
        { label: "Tell them to find an image under Creative Commons or Public Domain.", next: "s4_cc", points: 3 },
        { label: "Tell them to use it, but add a tiny link to the original site at the bottom.", next: "s4_link", points: 1 },
        { label: "Tell them to crop the watermark. Nobody will notice during a quick presentation.", next: "s4_crop", points: 0 }
      ]
    },
    s4_cc: {
      time: "10:35 AM", loc: "Main Hall", tag: "Action Taken",
      text: "<p>You send them a link to a free stock image site. The presentation looks just as professional, and you avoid any copyright issues.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },
    s4_link: {
      time: "10:35 AM", loc: "Main Hall", tag: "Action Taken",
      text: "<p>They use the image and add the link. It's not fully covered under fair use without permission, but it's better than just taking it outright.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },
    s4_crop: {
      time: "10:35 AM", loc: "Main Hall", tag: "Action Taken",
      text: "<p>They crop it out. That's a clear violation of intellectual property. They don't get caught today, but it's a bad habit to start.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },

    // SCENARIO 5: Lunch (Phishing)
    s5: {
      time: "12:15 PM", loc: "Cafeteria", tag: "Email Alert",
      text: "<p>You check your email while eating. There's a message titled <em>'Symposium VIP Upgrade Winner!'</em> It asks you to click a link and pay a small 50 PHP processing fee to claim a catered lunch and backstage access.</p>",
      choices: [
        { label: "Ignore the email and continue eating your standard lunch.", next: "s5_ignore", points: 1 },
        { label: "Click the link and input your payment details. It's only 50 PHP.", next: "s5_click", points: 0 },
        { label: "Verify the sender address, identify it as phishing, and report it to IT staff.", next: "s5_report", points: 3 }
      ]
    },
    s5_report: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Action Taken",
      text: "<p>You notice the sender's address ends in '.c0m' instead of '.com'. You report it to the event organizers, who send out a warning to all attendees.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },
    s5_ignore: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Action Taken",
      text: "<p>You delete the email. Your data stays safe, though a few other attendees probably fell for it.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },
    s5_click: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Action Taken",
      text: "<p>The site looks legitimate, but after you submit your details, it crashes. Two days later, you notice unauthorized charges on your account.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },

    // SCENARIO 6: Afternoon (Netiquette / Cyberbullying)
    s6: {
      time: "02:30 PM", loc: "Workshop Room", tag: "Online Thread",
      text: "<p>During a workshop, you check the event's official hashtag. An earlier speaker stumbled over their words, and a group of people are mocking them online, making memes and tagging the speaker directly.</p>",
      choices: [
        { label: "Report the abusive posts for harassment and send a supportive DM to the speaker.", next: "s6_support", points: 3 },
        { label: "Quote-retweet one of the memes with a sarcastic remark. It's just a joke.", next: "s6_join", points: 0 },
        { label: "Close the app. The internet is just like this sometimes.", next: "s6_lurk", points: 1 }
      ]
    },
    s6_support: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Action Taken",
      text: "<p>The platform takes down the worst posts. The speaker replies to your message, thanking you for reaching out.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },
    s6_join: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Action Taken",
      text: "<p>You join in. It gets you a few likes, but you're now part of the harassment, and it leaves a lasting mark on your digital footprint.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },
    s6_lurk: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Action Taken",
      text: "<p>You stay out of it. It's the safer choice for you, but the harassment keeps going without anyone stepping in.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },

    // SCENARIO 7: Closing (Defining MIL)
    s7: {
      time: "04:00 PM", loc: "Main Stage", tag: "Audience Q&A",
      text: "<p>The symposium is wrapping up. The moderator asks the audience one final question: <em>'With so much noise and information out there, how would you define someone who is media and information literate?'</em></p>",
      choices: [
        { label: "Someone who knows how to operate the latest technology and software.", next: "s7_tech", points: 1 },
        { label: "Someone who critically evaluates information and produces media ethically.", next: "s7_critical", points: 3 },
        { label: "Someone who relies on the most popular trends and influencers to stay updated.", next: "s7_popular", points: 0 }
      ]
    },
    s7_tech: {
      time: "04:05 PM", loc: "Main Stage", tag: "Final Thought",
      text: "<p>You focus on technology. Digital skills matter, but they're only the tools. Being literate means knowing how to use those tools responsibly.</p>",
      choices: [{ label: "View Evaluation", next: "score_gate", points: 0, type: "primary" }]
    },
    s7_popular: {
      time: "04:05 PM", loc: "Main Stage", tag: "Final Thought",
      text: "<p>You focus on trends. Relying only on what's popular is exactly how misinformation and propaganda end up spreading.</p>",
      choices: [{ label: "View Evaluation", next: "score_gate", points: 0, type: "primary" }]
    },
    s7_critical: {
      time: "04:05 PM", loc: "Main Stage", tag: "Final Thought",
      text: "<p>You hit the main idea. It's not just about taking in information, but checking sources, understanding intent, and knowing what's ethical.</p>",
      choices: [{ label: "View Evaluation", next: "score_gate", points: 0, type: "primary" }]
    },

    // ENDINGS
    ending_good: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "good", title: "Information Literate",
      text: "<p>Your decisions today reflect strong media and information literacy. You verified sources before reacting, protected your digital footprint, respected intellectual property, and treated others fairly online.</p><p>These are the habits that keep you from getting caught off guard by misinformation and online risks.</p>"
    },
    ending_neutral: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "neutral", title: "Passive Consumer",
      text: "<p>Your decisions today reflect a passive approach to digital media. You avoided the major pitfalls, but you often chose convenience or silence over actually verifying things or speaking up.</p><p>Small changes, like double-checking sources and getting more involved, can make a real difference.</p>"
    },
    ending_bad: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "bad", title: "Vulnerable to Noise",
      text: "<p>Your decisions today contributed to the spread of misinformation, put your personal data at risk, or crossed a line online. Making choices on impulse instead of double-checking leaves you open to manipulation and scams.</p><p>It's worth revisiting the basics of media and information literacy.</p>"
    }
  };

  let currentScore = 0;

  const el = {
    timestamp: document.getElementById("timestamp"),
    location: document.getElementById("location"),
    contextTag: document.getElementById("contextTag"),
    sceneText: document.getElementById("sceneText"),
    choices: document.getElementById("choices")
  };

  function renderNode(nodeId) {
    if (nodeId === "score_gate") {
      // 21 points max.
      // 17-21 = Good, 10-16 = Neutral, 0-9 = Bad.
      if (currentScore >= 17) nodeId = "ending_good";
      else if (currentScore >= 10) nodeId = "ending_neutral";
      else nodeId = "ending_bad";
    }

    const node = STORY[nodeId];

    el.timestamp.textContent = node.time;
    el.location.textContent = node.loc;

    if (node.badge) {
      el.contextTag.innerHTML = `<span class="ending-badge ${node.badge}">${node.title}</span>`;
      el.sceneText.innerHTML = node.text + `<p style="color:var(--text-muted); margin-top:16px; font-family:var(--mono); font-size:12px;">FINAL SCORE: ${currentScore} / 21</p>`;

      el.choices.innerHTML = "";
      const restartBtn = document.createElement("button");
      restartBtn.className = "btn";
      restartBtn.textContent = "Restart Module";
      restartBtn.onclick = () => { currentScore = 0; renderNode("start"); };
      el.choices.appendChild(restartBtn);
    } else {
      el.contextTag.textContent = node.tag;
      el.sceneText.innerHTML = node.text;
      el.choices.innerHTML = "";

      node.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = `btn ${choice.type === 'primary' ? 'primary' : ''}`;
        btn.textContent = choice.label;
        btn.onclick = () => {
          if (choice.points !== undefined) currentScore += choice.points;
          renderNode(choice.next);
        };
        el.choices.appendChild(btn);
      });
    }
  }

  // Initialize story
  renderNode("start");

  // Theme toggle (light / dark). No storage used, defaults to system preference.
  const ICONS = {
    dark: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>',
    light: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
  };

  const root = document.documentElement;
  const themeIcon = document.getElementById("themeIcon");
  const themeToggle = document.getElementById("themeToggle");

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeIcon.innerHTML = theme === "light" ? ICONS.light : ICONS.dark;
    themeToggle.setAttribute("title", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
  }

  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(prefersLight ? "light" : "dark");

  themeToggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(next);
  });
</script>

</body>
</html>
