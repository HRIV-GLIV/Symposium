<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Symposium Module</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap');

  :root {
    --bg-color: #0b0f15;
    --bg-gradient: radial-gradient(circle at top, #141b26 0%, #080a0e 100%);
    --panel-bg: #151921;
    --status-bg: #101319;
    --border-color: #272e38;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --accent-color: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.4);
    --good-color: #3fb950;
    --good-glow: rgba(63, 185, 80, 0.3);
    --neutral-color: #d29922;
    --neutral-glow: rgba(210, 153, 34, 0.3);
    --bad-color: #f85149;
    --bad-glow: rgba(248, 81, 73, 0.3);
    --shadow-color: rgba(0,0,0,0.5);
    --btn-hover: rgba(255,255,255,0.06);
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'Roboto Mono', monospace;
  }

  html[data-theme="light"] {
    --bg-color: #f1f5f9;
    --bg-gradient: radial-gradient(circle at top, #ffffff 0%, #e2e8f0 100%);
    --panel-bg: #ffffff;
    --status-bg: #f8fafc;
    --border-color: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent-color: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.3);
    --good-color: #16a34a;
    --good-glow: rgba(22, 163, 74, 0.2);
    --neutral-color: #ca8a04;
    --neutral-glow: rgba(202, 138, 4, 0.2);
    --bad-color: #dc2626;
    --bad-glow: rgba(220, 38, 38, 0.2);
    --shadow-color: rgba(15, 23, 42, 0.1);
    --btn-hover: rgba(0,0,0,0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-gradient);
    background-color: var(--bg-color);
    font-family: var(--sans);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    perspective: 1000px;
  }

  .device-frame {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 48px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    animation: dropIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96) rotateX(4deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
  }

  .progress-container {
    height: 3px;
    background: var(--status-bg);
    width: 100%;
    position: relative;
    z-index: 10;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent-color);
    width: 0%;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--status-bg);
    border-bottom: 1px solid var(--border-color);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    transition: background-color 0.4s ease, border-color 0.4s ease;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    background: var(--btn-hover);
    color: var(--text-main);
    transform: rotate(15deg) scale(1.1);
  }

  .theme-toggle svg {
    width: 15px;
    height: 15px;
    transition: transform 0.3s ease;
  }

  .scene-content {
    padding: 28px 24px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .scene-content.fade-out {
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
  }

  .context-tag {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent-color);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent-color);
    border-radius: 50%;
    display: inline-block;
    animation: pulseDot 2s infinite;
  }

  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 var(--accent-glow); }
    70% { box-shadow: 0 0 0 6px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  .text-bubble {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-main);
    margin-bottom: 28px;
  }

  .text-bubble p {
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeInUp 0.5s ease-out forwards;
  }
  
  .text-bubble p:nth-child(1) { animation-delay: 0.1s; }
  .text-bubble p:nth-child(2) { animation-delay: 0.2s; }
  .text-bubble p:nth-child(3) { animation-delay: 0.3s; }

  .text-bubble p:last-child {
    margin-bottom: 0;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .choices-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: auto;
    position: relative;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    font-family: var(--sans);
    font-size: 14px;
    text-align: left;
    padding: 16px 18px;
    border-radius: 14px;
    cursor: pointer;
    line-height: 1.4;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    animation: fadeInUp 0.4s ease-out forwards;
    transform: translateY(0);
  }

  .btn:nth-child(1) { animation-delay: 0.2s; }
  .btn:nth-child(2) { animation-delay: 0.3s; }
  .btn:nth-child(3) { animation-delay: 0.4s; }

  .btn:hover {
    background: var(--btn-hover);
    border-color: var(--text-muted);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow-color);
  }

  .btn:active {
    transform: translateY(1px);
  }

  /* Interaction Animations */
  .btn.selected {
    animation: selectFlash 0.5s ease-out forwards;
    z-index: 10;
  }

  @keyframes selectFlash {
    0% { box-shadow: 0 0 0 0 var(--accent-glow); background: transparent; }
    40% { box-shadow: 0 0 25px 5px var(--accent-glow); background: var(--accent-color); color: #fff; transform: scale(1.02); border-color: var(--accent-color); }
    100% { box-shadow: 0 0 15px 0 var(--accent-glow); background: var(--accent-color); color: #fff; transform: scale(1.01); border-color: var(--accent-color); }
  }

  .btn.dimmed {
    opacity: 0.3 !important;
    transform: scale(0.96) !important;
    filter: grayscale(80%);
    pointer-events: none;
  }

  .btn.primary {
    background: var(--text-main);
    color: var(--bg-color);
    text-align: center;
    font-weight: 600;
    border-color: var(--text-main);
    box-shadow: 0 4px 14px var(--shadow-color);
  }

  .btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px var(--shadow-color);
  }

  .btn.primary.selected {
    animation: primaryFlash 0.5s ease-out forwards;
  }

  @keyframes primaryFlash {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); box-shadow: 0 0 30px var(--text-main); }
    100% { transform: scale(1.02); box-shadow: 0 0 15px var(--text-main); }
  }

  .ending-badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 16px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
  }
  .ending-badge.good { background: var(--good-glow); color: var(--good-color); box-shadow: 0 0 20px var(--good-glow); }
  .ending-badge.neutral { background: var(--neutral-glow); color: var(--neutral-color); box-shadow: 0 0 20px var(--neutral-glow); }
  .ending-badge.bad { background: var(--bad-glow); color: var(--bad-color); box-shadow: 0 0 20px var(--bad-glow); }

  .score-display {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    background: var(--btn-hover);
    border: 1px solid var(--border-color);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    opacity: 0;
    animation: fadeInUp 0.5s ease-out forwards;
    animation-delay: 0.6s;
  }

  .score-display span {
    display: block;
    font-size: 24px;
    color: var(--text-main);
    font-weight: 600;
    margin-top: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="device-frame">
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-bar">
      <span id="timestamp">07:00 AM</span>
      <div class="status-right">
        <span id="location">Home</span>
        <button id="themeToggle" class="theme-toggle" aria-label="Switch between light and dark mode" title="Switch theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </div>

    <div class="scene-content" id="sceneContent">
      <div class="context-tag" id="contextTag"></div>
      <div class="text-bubble" id="sceneText"></div>
      <div class="choices-container" id="choices"></div>
    </div>
  </div>
</div>

<script>
  const STORY = {
    start: {
      time: "07:30 AM", loc: "Home", tag: "Group Chat",
      text: "<p>You wake up and check your phone. Your aunt sent a long message in the family group chat saying a new local virus is spreading, ending with 'SHARE THIS BEFORE IT GETS DELETED'.</p><p>A few relatives are already replying and getting worried.</p>",
      choices: [
        { label: "Search for official news to see if it's actually true.", next: "s1_verify", points: 3 },
        { label: "Forward it to your friends just in case.", next: "s1_share", points: 0 },
        { label: "Ignore the message and get ready for the day.", next: "s1_ignore", points: 1 }
      ]
    },
    s1_verify: {
      time: "07:35 AM", loc: "Home", tag: "Group Chat",
      text: "<p>You do a quick search and find out it's an old hoax from three years ago. You send a link to an article debunking it, and your relatives calm down.</p>",
      choices: [{ label: "Leave for the event", next: "s2", points: 0, type: "primary" }]
    },
    s1_share: {
      time: "07:35 AM", loc: "Home", tag: "Group Chat",
      text: "<p>You send it to your friends. A few hours later, you find out it was a fake message. You just helped spread unnecessary panic.</p>",
      choices: [{ label: "Leave for the event", next: "s2", points: 0, type: "primary" }]
    },
    s1_ignore: {
      time: "07:35 AM", loc: "Home", tag: "Group Chat",
      text: "<p>You mute the chat. You didn't spread the rumor yourself, but your aunt keeps sending more updates and your family stays worried.</p>",
      choices: [{ label: "Leave for the event", next: "s2", points: 0, type: "primary" }]
    },

    s2: {
      time: "08:15 AM", loc: "Transit", tag: "Social Media",
      text: "<p>You're on the way to the symposium. You open a social media app and see a very angry video about a local issue. You agree with the person, but some of the statistics they use sound made up.</p>",
      choices: [
        { label: "Scroll past it. It's too early to get into internet arguments.", next: "s2_scroll", points: 1 },
        { label: "Leave a comment agreeing with the video.", next: "s2_react", points: 0 },
        { label: "Check the account to see if they are a reliable source.", next: "s2_critical", points: 3 }
      ]
    },
    s2_scroll: {
      time: "08:20 AM", loc: "Transit", tag: "Social Media",
      text: "<p>You keep scrolling. You avoid the stress, but your feed keeps showing similar content anyway.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },
    s2_react: {
      time: "08:20 AM", loc: "Transit", tag: "Social Media",
      text: "<p>You leave a comment. Because you interacted with it, the app starts pushing more aggressive, one-sided videos onto your timeline.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },
    s2_critical: {
      time: "08:20 AM", loc: "Transit", tag: "Social Media",
      text: "<p>You look at their profile and notice they only post clickbait to make people mad. You close the app and move on.</p>",
      choices: [{ label: "Arrive at venue", next: "s3", points: 0, type: "primary" }]
    },

    s3: {
      time: "09:00 AM", loc: "Registration Desk", tag: "Event Sign-In",
      text: "<p>You reach the registration desk. The tablet asks you to log in with your main Facebook or Google account to print your ID. There's a long terms and conditions page that no one is reading.</p>",
      choices: [
        { label: "Type in your name and email manually instead of linking an account.", next: "s3_manual", points: 1 },
        { label: "Ask the staff if they can just give you a blank paper ID.", next: "s3_protect", points: 3 },
        { label: "Log in with your account. It's faster and everyone else is doing it.", next: "s3_give", points: 0 }
      ]
    },
    s3_manual: {
      time: "09:05 AM", loc: "Registration Desk", tag: "Event Sign-In",
      text: "<p>You type your details manually. It takes a bit longer, but you didn't have to link your entire social media profile to their system.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },
    s3_protect: {
      time: "09:05 AM", loc: "Registration Desk", tag: "Event Sign-In",
      text: "<p>The staff just hands you a standard ID. You don't get the QR code feature, but your personal data is completely safe.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },
    s3_give: {
      time: "09:05 AM", loc: "Registration Desk", tag: "Event Sign-In",
      text: "<p>You log in. By lunch time, you get three automated promotional emails from the event sponsors. You traded your data to save ten seconds.</p>",
      choices: [{ label: "Enter the hall", next: "s4", points: 0, type: "primary" }]
    },

    s4: {
      time: "10:30 AM", loc: "Main Hall", tag: "Message",
      text: "<p>You are listening to a talk when a groupmate messages you. They are making a presentation and found a good image on Google, but it has a watermark. They ask if they should just crop it out.</p>",
      choices: [
        { label: "Tell them to just crop it. No one is going to notice during the presentation.", next: "s4_crop", points: 0 },
        { label: "Tell them to use a free stock photo site instead.", next: "s4_cc", points: 3 },
        { label: "Tell them to use it but put a link to the website at the bottom.", next: "s4_link", points: 1 }
      ]
    },
    s4_crop: {
      time: "10:35 AM", loc: "Main Hall", tag: "Message",
      text: "<p>They crop it. No one in the class notices, but it's still plagiarism and a bad habit to start.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },
    s4_cc: {
      time: "10:35 AM", loc: "Main Hall", tag: "Message",
      text: "<p>You send them a link to a site with free images. The slides look fine and you don't break any copyright rules.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },
    s4_link: {
      time: "10:35 AM", loc: "Main Hall", tag: "Message",
      text: "<p>They keep the image and add a small link. It's not exactly fair use, but at least they tried to give credit.</p>",
      choices: [{ label: "Break for lunch", next: "s5", points: 0, type: "primary" }]
    },

    s5: {
      time: "12:15 PM", loc: "Cafeteria", tag: "Email Alert",
      text: "<p>You are eating lunch and check your email. You have a message saying you won a 'VIP Symposium Package'. It asks you to click a link and pay a 50 peso fee for processing.</p>",
      choices: [
        { label: "Check the sender's email address to see if it's official.", next: "s5_report", points: 3 },
        { label: "Ignore it and continue eating.", next: "s5_ignore", points: 1 },
        { label: "Click the link. It's only 50 pesos.", next: "s5_click", points: 0 }
      ]
    },
    s5_report: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Email Alert",
      text: "<p>You check the sender and see it's a random string of numbers. It's a phishing scam. You delete it immediately.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },
    s5_ignore: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Email Alert",
      text: "<p>You just delete the email. You don't get scammed, but you didn't look into it either.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },
    s5_click: {
      time: "12:20 PM", loc: "Cafeteria", tag: "Email Alert",
      text: "<p>You click the link and it asks for your GCash pin. You realize it's a scam right before typing it in and close the tab.</p>",
      choices: [{ label: "Return to sessions", next: "s6", points: 0, type: "primary" }]
    },

    s6: {
      time: "02:30 PM", loc: "Workshop Room", tag: "Online Thread",
      text: "<p>You look up the event's hashtag online. A speaker messed up their words earlier, and people are making fun of them. Some users are making mean edits and tagging the speaker.</p>",
      choices: [
        { label: "Retweet one of the lighter jokes. It's not that deep.", next: "s6_join", points: 0 },
        { label: "Close the app. You don't want to get involved.", next: "s6_lurk", points: 1 },
        { label: "Report the worst posts and send the speaker a nice message.", next: "s6_support", points: 3 }
      ]
    },
    s6_join: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Online Thread",
      text: "<p>You retweet it. You get a few likes, but you later realize you just helped bully someone online.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },
    s6_lurk: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Online Thread",
      text: "<p>You close the app. It's easier to just stay out of the drama, even if the harassment continues.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },
    s6_support: {
      time: "02:35 PM", loc: "Workshop Room", tag: "Online Thread",
      text: "<p>You report the accounts. The speaker actually replies to your message later to say thank you.</p>",
      choices: [{ label: "Attend closing ceremony", next: "s7", points: 0, type: "primary" }]
    },

    s7: {
      time: "04:00 PM", loc: "Main Stage", tag: "Q&A",
      text: "<p>The event is ending. The host asks the audience: 'How would you define someone who is media and information literate?'</p>",
      choices: [
        { label: "Someone who reads a lot of news articles online.", next: "s7_news", points: 1 },
        { label: "Someone who knows how to use all the new apps and gadgets.", next: "s7_tech", points: 0 },
        { label: "Someone who checks their sources and thinks before they post.", next: "s7_critical", points: 3 }
      ]
    },
    s7_news: {
      time: "04:05 PM", loc: "Main Stage", tag: "Q&A",
      text: "<p>Reading a lot is good, but it's not enough if you don't know how to check if the articles are actually true.</p>",
      choices: [{ label: "View Results", next: "score_gate", points: 0, type: "primary" }]
    },
    s7_tech: {
      time: "04:05 PM", loc: "Main Stage", tag: "Q&A",
      text: "<p>Knowing how to use technology just means you have digital skills. Literacy means knowing how to use those tools responsibly.</p>",
      choices: [{ label: "View Results", next: "score_gate", points: 0, type: "primary" }]
    },
    s7_critical: {
      time: "04:05 PM", loc: "Main Stage", tag: "Q&A",
      text: "<p>That's the main point. It's not just about using the internet, but understanding the information and knowing what is ethical.</p>",
      choices: [{ label: "View Results", next: "score_gate", points: 0, type: "primary" }]
    },

    ending_good: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "good", title: "Information Literate",
      text: "<p>Your choices show you understand media and information literacy. You check facts before reacting, protect your personal data, respect copyright, and treat people properly online.</p><p>Check the scoring table in the E-Magazine to see the breakdown of your points.</p>"
    },
    ending_neutral: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "neutral", title: "Passive Consumer",
      text: "<p>Your choices show a passive approach. You didn't do anything majorly wrong, but you mostly chose convenience over checking facts or protecting your data.</p><p>Check the scoring table in the E-Magazine to see how you can improve your habits.</p>"
    },
    ending_bad: {
      time: "05:00 PM", loc: "Event Concluded",
      badge: "bad", title: "Vulnerable to Noise",
      text: "<p>Your choices show you act mostly on impulse. By not checking sources or thinking about privacy, you make yourself vulnerable to fake news, scams, and bad digital habits.</p><p>Check the scoring table in the E-Magazine to review the basics of media literacy.</p>"
    }
  };

  let currentScore = 0;
  let isTransitioning = false;

  const el = {
    timestamp: document.getElementById("timestamp"),
    location: document.getElementById("location"),
    contextTag: document.getElementById("contextTag"),
    sceneText: document.getElementById("sceneText"),
    choices: document.getElementById("choices"),
    sceneContent: document.getElementById("sceneContent"),
    progressBar: document.getElementById("progressBar")
  };

  // Determine stage progress (0 to 8 stages)
  const stages = ['start', 's1', 's2', 's3', 's4', 's5', 's6', 's7'];
  function updateProgress(nodeId) {
    if (nodeId.startsWith('ending')) {
      el.progressBar.style.width = '100%';
      return;
    }
    const stagePrefix = nodeId.split('_')[0];
    let index = stages.indexOf(stagePrefix);
    if (index === -1) index = 0;
    const percentage = (index / stages.length) * 100;
    el.progressBar.style.width = `${percentage}%`;
  }

  async function handleChoice(choice, btn) {
    if (isTransitioning) return;
    isTransitioning = true;

    // Trigger visual selection effects
    btn.classList.add('selected');
    
    // Dim other options
    Array.from(el.choices.children).forEach(child => {
      if (child !== btn) child.classList.add('dimmed');
    });

    // Small delay to let user enjoy the click feedback
    await new Promise(r => setTimeout(r, 450));

    // Fade out scene
    el.sceneContent.classList.add('fade-out');
    
    await new Promise(r => setTimeout(r, 350));

    // Update Game State
    if (choice.points !== undefined) currentScore += choice.points;
    renderNode(choice.next);
  }

  function renderNode(nodeId) {
    if (nodeId === "score_gate") {
      if (currentScore >= 17) nodeId = "ending_good";
      else if (currentScore >= 10) nodeId = "ending_neutral";
      else nodeId = "ending_bad";
    }

    updateProgress(nodeId);
    const node = STORY[nodeId];

    el.timestamp.textContent = node.time;
    el.location.textContent = node.loc;

    if (node.badge) {
      el.contextTag.innerHTML = `<span class="ending-badge ${node.badge}">${node.title}</span>`;
      el.sceneText.innerHTML = node.text + `<div class="score-display">FINAL SCORE:<span>${currentScore} / 21</span></div>`;
      
      el.choices.innerHTML = "";
      const restartBtn = document.createElement("button");
      restartBtn.className = "btn primary";
      restartBtn.textContent = "Restart Module";
      restartBtn.onclick = () => { 
        if(isTransitioning) return;
        currentScore = 0; 
        isTransitioning = true;
        el.sceneContent.classList.add('fade-out');
        setTimeout(() => renderNode("start"), 400);
      };
      el.choices.appendChild(restartBtn);
    } else {
      el.contextTag.innerHTML = `<span class="live-dot"></span>${node.tag}`;
      el.sceneText.innerHTML = node.text;
      el.choices.innerHTML = "";

      node.choices.forEach((choice, index) => {
        const btn = document.createElement("button");
        btn.className = `btn ${choice.type === 'primary' ? 'primary' : ''}`;
        btn.textContent = choice.label;
        btn.onclick = () => handleChoice(choice, btn);
        el.choices.appendChild(btn);
      });
    }

    // Force reflow to restart CSS animations, then fade back in
    void el.sceneContent.offsetWidth; 
    el.sceneContent.classList.remove('fade-out');
    
    setTimeout(() => { isTransitioning = false; }, 500);
  }

  // Initial Boot
  renderNode("start");

  const ICONS = {
    dark: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>',
    light: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
  };

  const root = document.documentElement;
  const themeIcon = document.getElementById("themeIcon");
  const themeToggle = document.getElementById("themeToggle");

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeIcon.innerHTML = theme === "light" ? ICONS.light : ICONS.dark;
    themeToggle.setAttribute("title", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
  }

  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(prefersLight ? "light" : "dark");

  themeToggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(next);
  });
</script>

</body>
</html>
